<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>

<body>
<div class="registrar-container">
    <div class="formulario">
        <img id="previewImagem" alt="Prévia da imagem" style="display:none;" />
        <input type="text" id="nomeProduto" placeholder="Digite o nome do produto" />
        <input type="text" id="areaProduto" placeholder="Digite a área do produto" />
        <input type="date" id="dataEntrada" />
        <button id="voltar"><i class="material-icons">subdirectory_arrow_left</i></button>
        <button id="registrar"><i class="material-icons">check</i></button>
        <button id="home"><i class="material-icons">home</i></button>
    </div>
</div>

<script src="/assets/js/registro.js"></script>
</body>

</html>
