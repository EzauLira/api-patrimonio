<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Produto</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="manifest" href="manifest.json" />
    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js');
        }
    </script>

</head>

<body>
<div class="registrar-container">
    <!-- Prévia da foto -->
    <div id="previewFoto"></div>

    <div class="formulario">
        <!-- Campos -->
        <input type="text" id="nomeProduto" placeholder="Digite o nome do produto" required />
        <input type="text" id="areaProduto" placeholder="Digite a área do produto" required />
        <input type="date" id="dataEntrada" required />

        <!-- Botões -->
        <div class="botoes">
            <button id="btnNovaFoto" title="Adicionar nova foto">
                <i class="material-icons">add_a_photo</i>
            </button>
            <button id="editar" title="Salvar alterações">
                <i class="material-icons">check</i>
            </button>
            <button id="voltar" title="Voltar">
                <i class="material-icons">subdirectory_arrow_left</i>
            </button>
        </div>
    </div>
</div>

<!-- Script -->
<script src="/assets/js/pgEditorjs.js"></script>
</body>

</html>
