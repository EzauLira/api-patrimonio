<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listar Por Área</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <link rel="manifest" href="manifest.json" />
    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js');
        }
    </script>

</head>
<body>
<div class="listarProdutosArea-container">
    <h2>Lista da Área</h2>

    <div id="lista-produtos-area"></div>

    <br></br>

    <input type="text" id="inputArea" placeholder="Digite a área de busca" />

    <div class="botoes">
        <button id="filtrar" title="Filtrar por Área">
            <i class="material-icons">search</i>
        </button>
        <button id="voltar" title="Voltar ao Menu">
            <i class="material-icons">home</i>
        </button>
    </div>
</div>

<script src="/assets/js/listarProdutosArea.js"></script>
</body>
</html>
