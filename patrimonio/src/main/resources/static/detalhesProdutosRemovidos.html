<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes Produto Removido</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <link rel="manifest" href="manifest.json" />
    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js');
        }
    </script>

</head>
<body>
<div class="detalhes-container">
    <h2>Detalhes do Produto Removido</h2>

    <table class="detalhes-tabela">
        <tr><td id="foto" colspan="2">Nenhuma imagem disponível</td></tr>
        <tr><th>Nº de Série</th><td id="idProduto"></td></tr>
        <tr><th>Nome</th><td id="nomeProduto"></td></tr>
        <tr><th>Área</th><td id="areaProduto"></td></tr>
        <tr><th>Data de Entrada</th><td id="dataEntrada"></td></tr>
    </table>

    <div class="botoes">
        <button id="restaurar" title="Restaurar Produto">
            <i class="material-icons">restore_from_trash</i>
        </button>
        <button id="voltar" title="Voltar">
            <i class="material-icons">subdirectory_arrow_left</i>
        </button>
    </div>
</div>

<script src="/assets/js/detalhesRemovidos.js"></script>
</body>
</html>
