<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes Produto Removido</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body>
<div class="detalhes-container">
    <h2>Detalhes do Produto Removido</h2>

    <table class="imagem">
        <h2>Espaço para imagem</h2>
    </table>

    <table class="detalhes-tabela">
        <tr><th>Nº de Série</th><td id="idProduto"></td></tr>
        <tr><th>Nome</th><td id="nomeProduto"></td></tr>
        <tr><th>Área</th><td id="areaProduto"></td></tr>
        <tr><th>Data de Entrada</th><td id="dataEntrada"></td></tr>
    </table>

    <br />

    <button id="restaurar">
        <i class="material-icons">restore_from_trash</i>
    </button>

    <button id="voltar">
        <i class="material-icons">subdirectory_arrow_left</i>
    </button>


</div>

<script src="/assets/js/detalhesRemovidos.js"></script>
</body>
</html>
